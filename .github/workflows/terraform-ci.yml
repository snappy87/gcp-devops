Now that your CI/CD workflow is written and your credentials secret is stored in GitHub, push your changes:

```bash
git add .github/workflows/terraform-ci.yml
git commit -m "ci(github-actions): upgrade workflow to full CI/CD deployment pipeline"
git push origin main